name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      # Default checkout fetches the tag-push event as `+<commit-sha>:refs/tags/<tag>`
      # with --no-tags, so HEAD lands on the commit — but that also leaves the
      # local tag as a pseudo-tag pointing at the commit, so upload steps can
      # misread it. (fetch-tags: true was tried to bring the annotated object
      # in, but it removes git's --no-tags guard, and the shallow fetch then
      # crashes on annotated tags: "Cannot fetch both <sha> and refs/tags/"
      # — observed on the first v1.1.0 release run.)
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The workspace is disposable, so the release key is never stored —
      # it is re-materialized from base64 in repo secrets at publish time.
      - name: Materialize signing key from secrets
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE" ]; then
            printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > calc-release.jks
            printf 'storeFile=calc-release.jks\nstorePassword=%s\nkeyAlias=calc\nkeyPassword=%s\n' \
              "$RELEASE_STORE_PASSWORD" "$RELEASE_KEY_PASSWORD" > keystore.properties
            echo "Signing with the release key."
          else
            echo "RELEASE_KEYSTORE unset — falling back to debug signing."
          fi

      - name: Verify (lint, unit tests) and build release APK
        run: ./gradlew :app:lintRelease :app:testDebugUnitTest :app:assembleRelease

      # Re-fetch the tag ref onto itself: checkout left the local tag aimed at
      # the commit (pseudo-tag), which degrades `git tag --format=%(contents)`
      # to the pointed-at commit's message — the exact notes bug seen on
      # v1.0.0. This forced overwrite installs the real annotated tag object,
      # restoring the curated notes. (Verified against a scratch repository.)
      - name: Fetch release annotation
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_NAME="calc-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          notes="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          gh release create "$GITHUB_REF_NAME" "$APK_NAME" \
            --title "calc $GITHUB_REF_NAME" \
            --notes "$notes" \
            --latest
